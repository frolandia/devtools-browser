name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate & Setup Gradle Wrapper
      run: |
        echo "=== Current gradle-wrapper.properties ==="
        cat gradle/wrapper/gradle-wrapper.properties

        # Force Gradle 8.7 (required by AGP 8.5.0+)
        if ! grep -q "gradle-8.7" gradle/wrapper/gradle-wrapper.properties; then
          echo "WARNING: Gradle version mismatch! Forcing Gradle 8.7..."
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' gradle/wrapper/gradle-wrapper.properties
        fi

        # Ensure gradlew exists and is executable
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, generating wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

        # Ensure gradle-wrapper.jar exists
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "gradle-wrapper.jar not found, downloading..."
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
        fi

        echo "=== Final gradle-wrapper.properties ==="
        cat gradle/wrapper/gradle-wrapper.properties
        echo "=== gradlew permissions ==="
        ls -la gradlew
        echo "=== gradle-wrapper.jar ==="
        ls -la gradle/wrapper/gradle-wrapper.jar

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DevTools-Browser-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DevTools-Browser-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.0.${{ github.run_number }}
        name: DevTools Browser v3.0.${{ github.run_number }}
        body: |
          ### DevTools Mobile Browser v3.0 — Kotlin + TypeScript Rewrite
          - Migrated to Kotlin & TypeScript
          - Multi-tab support, Bookmarks, History
          - Enhanced Native DevTools (Performance, Settings tabs)
          - Advanced Scraper (XPath, Structured Data, Accessibility Audit)
          - Modern UI with Material Design 3
          - Dark/Light theme toggle
          - R8/ProGuard minification for Release builds
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
